<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿アプリ - リダイレクト中...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📊</div>
        <h1>家計簿アプリ</h1>
        <div class="spinner"></div>
        <p>PWA版にリダイレクト中...</p>
        <p><a href="PWA-HouseholdBudgetApp/" style="color: white;">手動でアクセス</a></p>
    </div>
    
    <script>
        // 3秒後にPWA版にリダイレクト
        setTimeout(() => {
            window.location.href = 'PWA-HouseholdBudgetApp/';
        }, 3000);
    </script>
</body>
</html>
